<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiroGlifx Visual Playground</title>
<style>
body{font:16px system-ui;background:#111827;color:#e5e7eb;margin:0;padding:24px}
main{max-width:1000px;margin:auto} .layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
textarea{box-sizing:border-box;width:100%;height:380px;background:#0b1220;color:#c4f1fd;border:1px solid #46546d;border-radius:12px;padding:16px;font:14px/1.7 monospace}
#stage{background:#101827;min-height:365px;border:1px solid #46546d;border-radius:12px;padding:16px;overflow:hidden;text-align:center}
#stage button{padding:10px 18px;border:0;border-radius:9px;cursor:pointer}
#stage p{font-size:24px;font-weight:bold}button.run{padding:12px 20px;border:0;border-radius:8px;background:#60a5fa;color:#071a31;font-weight:bold;margin:12px 0;cursor:pointer}
#error{white-space:pre-wrap;color:#fca5a5;min-height:25px}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>HiroGlifx Visual Playground</h1>
<p>Write simple commands, run them, and interact with the preview. This playground intentionally does not execute browser automation commands.</p>
<button class="run" id="run">Run scroll</button><div id="error" role="alert"></div>
<div class="layout">
<textarea id="source" spellcheck="false" aria-label="Scroll source">page "My HiroGlifx App"
background "#101827"
text heading "Hello from HiroGlifx"
box square 90 90 blue
center square
animate square bounce 1300 infinite
button change "Spin and recolor"
on click change => color square purple
on click change => animate square spin 700</textarea>
<div id="stage" aria-label="Live preview"></div>
</div></main>
<script src="./runtime/scroll-runtime.js"></script>
<script>
let runtime;
document.getElementById("run").addEventListener("click", async () => {
  const stage = document.getElementById("stage");
  const error = document.getElementById("error"); error.textContent = "";
  if (runtime) runtime.dispose();
  stage.replaceChildren();
  runtime = new HiroGlifxRuntime.Runtime({ document, mount:stage });
  try { await runtime.execute(document.getElementById("source").value); }
  catch(e){ error.textContent = e.message; }
});
document.getElementById("run").click();
</script>
</body></html>

name: Web runtime tests
on:
  push:
    branches: [main, feat/web-visual-browser-runtime, feat/reactive-scroll-apps, feat/phase3-persistent-data, feat/phase4-auth-permissions, feat/phase5-browser-policy-cli, feat/phase6-sandboxed-playground, feat/phase7-postgres-store, feat/phase8-owned-api, feat/phase9-deployment-tests, feat/cli-extensions-visual-dsl, feat/phase11-scroll-packages, feat/phase12-game-video-studio, feat/phase13-canonical-expressions, feat/phase14-canonical-obby-game, feat/phase15-skybound-showcase]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check runtime/scroll-runtime.js
          node --check runtime/app-runtime.js
          node --check runtime/expressive-runtime.js
          node --check runtime/canonical-runtime.js
          node --check runtime/canonical-blueprints.js
          node --check runtime/obby-world.js
          node --check runtime/skybound-world.js
          node --check tests/skybound.test.js
          node --check runtime/obby-canonical.js
          node --check runtime/obby-babylon.js
          node --check tests/obby-canonical.test.js
          node --check tests/canonical-runtime.test.js
          node --check runtime/creative-scene.js
          node --check runtime/phaser-adapter.js
          node --check runtime/babylon-adapter.js
          node --check tests/creative-engines.test.js
          node --check runtime/package-manager.js
          node --check tests/package-manager.test.js
          node --check runtime/dev-server.js
          node --check hiro.js
          node --check tests/expressive-cli.test.js
          node --check runtime/preview-policy.js
          node --check tests/preview-policy.test.js
          node --check runtime/data-server.js
          node --check runtime/postgres-store.js
          node --check runtime/owned-api-server.js
          node --check runtime/run-postgres-api.js
          node --check runtime/auth-server.js
          node --check runtime/browser-policy.js
          node --check runtime/run-browser.js
          node --check runtime/run-auth-server.js
          node --check runtime/create-user.js
          node --check runtime/run-data-server.js
          node --check runtime/playwright-adapter.js
          node --check runtime/run-server.js
          node --check tests/runtime.test.js
          node --check tests/app-runtime.test.js
      - name: Runtime tests
        run: node --test tests/*.test.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hiro
          POSTGRES_PASSWORD: hiro_ci_password
          POSTGRES_DB: hiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiro -d hiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HIRO_TEST_DATABASE_URL: postgresql://hiro:hiro_ci_password@127.0.0.1:5432/hiro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PostgreSQL driver
        run: npm install --no-save --ignore-scripts pg@8
      - name: Real PostgreSQL integration test
        run: node --test tests/postgres-integration.test.js

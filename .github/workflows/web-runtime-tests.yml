name: Web runtime tests
on:
  push:
    branches: [main, feat/web-visual-browser-runtime, feat/reactive-scroll-apps, feat/phase3-persistent-data, feat/phase4-auth-permissions, feat/phase5-browser-policy-cli, feat/phase6-sandboxed-playground, feat/phase7-postgres-store, feat/phase8-owned-api, feat/phase9-deployment-tests, feat/cli-extensions-visual-dsl, feat/phase11-scroll-packages, feat/phase12-game-video-studio, feat/phase13-canonical-expressions, feat/phase14-canonical-obby-game, feat/phase15-skybound-showcase, feat/phase16-skybound-physics-feel, feat/phase17-voxel-sandbox, feat/phase18-arcade-and-source-viewer, feat/phase19-native-scroll-pong, feat/phase20-native-scroll-games, feat/phase21-polymorphic-game-library, feat/phase22-native-3d-game-rules, feat/phase23-26-action-rpg-foundations]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check runtime/scroll-runtime.js
          node --check runtime/app-runtime.js
          node --check runtime/expressive-runtime.js
          node --check runtime/canonical-runtime.js
          node --check runtime/canonical-blueprints.js
          node --check runtime/obby-world.js
          node --check runtime/skybound-world.js
          node --check runtime/scroll-game-runtime.js
          node --check runtime/scroll-game-classes.js
          node --check runtime/scroll-world-rules.js
          node --check runtime/game-physics.js
          node --check runtime/game-assets.js
          node --check runtime/game-combat.js
          node --check runtime/game-ai.js
          node --check runtime/steam-rpg-demo.js
          node --check tests/steam-game-foundations.test.js
          node --check e2e/riftfall-smoke.js
          node --check tests/native-3d-game-rules.test.js
          node --check tests/scroll-game-classes.test.js
          node --check tests/scroll-game-package-import.test.js
          node --check e2e/polymorphism-smoke.js
          node --check tests/scroll-game-runtime.test.js
          node --check tests/native-arcade-all.test.js
          node --check runtime/arcade-games.js
          node --check runtime/arcade-chess.js
          node --check runtime/arcade-canonical.js
          node --check tests/arcade-games.test.js
          node --check e2e/arcade-smoke.js
          node --check runtime/voxel-world.js
          node --check runtime/voxel-canonical.js
          node --check runtime/voxel-babylon.js
          node --check tests/voxel-world.test.js
          node --check e2e/blockhaven-smoke.js
          node --check tests/skybound.test.js
          node --check tests/skybound-physics-feel.test.js
          node --check tests/skybound-course-path.test.js
          node --check e2e/skybound-smoke.js
          node --check runtime/obby-canonical.js
          node --check runtime/obby-babylon.js
          node --check tests/obby-canonical.test.js
          node --check tests/canonical-runtime.test.js
          node --check runtime/creative-scene.js
          node --check runtime/phaser-adapter.js
          node --check runtime/babylon-adapter.js
          node --check tests/creative-engines.test.js
          node --check runtime/package-manager.js
          node --check tests/package-manager.test.js
          node --check runtime/dev-server.js
          node --check hiro.js
          node --check tests/expressive-cli.test.js
          node --check runtime/preview-policy.js
          node --check tests/preview-policy.test.js
          node --check runtime/data-server.js
          node --check runtime/postgres-store.js
          node --check runtime/owned-api-server.js
          node --check runtime/run-postgres-api.js
          node --check runtime/auth-server.js
          node --check runtime/browser-policy.js
          node --check runtime/run-browser.js
          node --check runtime/run-auth-server.js
          node --check runtime/create-user.js
          node --check runtime/run-data-server.js
          node --check runtime/playwright-adapter.js
          node --check runtime/run-server.js
          node --check tests/runtime.test.js
          node --check tests/app-runtime.test.js
      - name: Runtime tests
        run: node --test tests/*.test.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hiro
          POSTGRES_PASSWORD: hiro_ci_password
          POSTGRES_DB: hiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiro -d hiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HIRO_TEST_DATABASE_URL: postgresql://hiro:hiro_ci_password@127.0.0.1:5432/hiro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PostgreSQL driver
        run: npm install --no-save --ignore-scripts pg@8
      - name: Real PostgreSQL integration test
        run: node --test tests/postgres-integration.test.js

  skybound-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Skybound in real Chromium
        run: node e2e/skybound-smoke.js
      - name: Upload real desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skybound-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: warn

  blockhaven-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Blockhaven in real Chromium
        run: node e2e/blockhaven-smoke.js
      - name: Upload voxel desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockhaven-browser-screenshots
          path: artifacts/blockhaven-*.png
          if-no-files-found: warn

  arcade-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play six arcade games and verify source viewers
        run: node e2e/arcade-smoke.js
      - name: Upload actual arcade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-browser-screenshots
          path: artifacts/arcade-*.png
          if-no-files-found: warn
      - name: Upload Blockhaven source screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockhaven-source-screenshot
          path: artifacts/blockhaven-source-panel.png
          if-no-files-found: warn

  polymorphism-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute imported polymorphic HiroGlifx games
        run: node e2e/polymorphism-smoke.js
      - name: Upload real browser images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-browser-screenshots
          path: artifacts/polymorphism-*.png
          if-no-files-found: warn

  riftfall-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise Havok RPG, animation and enemy navigation
        run: node e2e/riftfall-smoke.js
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftfall-browser-screenshots
          path: artifacts/riftfall-*.png
          if-no-files-found: warn

name: Riftfall unsigned desktop installers
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/prepare-riftfall-desktop.js'
      - 'scripts/stage-riftfall-desktop-app.js'
      - 'scripts/build-riftfall-unsigned.js'
      - 'scripts/vendor-riftfall-engine.js'
      - '.github/workflows/riftfall-unsigned-desktop.yml'
  workflow_dispatch:
jobs:
  unsigned:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux
          - runner: windows-2025
            name: windows
          - runner: macos-15
            name: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned game dependencies and packaging tools
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit babylonjs@9.37.0 babylonjs-loaders@9.37.0 @babylonjs/havok@1.3.14 recast-detour@1.6.4 electron-builder@26.18.0 electron@43.8.10
      - name: Verify vendor assets and create offline application
        run: |
          node scripts/vendor-riftfall-engine.js
          node scripts/prepare-riftfall-desktop.js
          node scripts/stage-riftfall-desktop-app.js
      - name: Build unsigned host installer for developer testing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/build-riftfall-unsigned.js
      - name: Upload unsigned output (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftfall-unsigned-${{ matrix.name }}
          path: releases/unsigned/**
          if-no-files-found: warn

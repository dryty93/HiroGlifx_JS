name: Experimental agent runtime
on:
  push:
    branches:
      - qa
      - 'feature/**'
      - 'fix/**'
  pull_request:
    paths:
      - 'experimental/**'
      - '.github/workflows/experimental-agent-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check experimental/lexer.js
          node --check experimental/parser.js
          node --check experimental/runtime.js
          node --check experimental/cli.js
          node --check experimental/language/expressions.js
          node --check experimental/modules.js
          node --check experimental/studio/server.js
          node --check experimental/studio/app.js
          node --check experimental/studio/editor-core.js
          node --check experimental/studio/ide.js
          node --check experimental/studio/workspace-core.js
          node --check experimental/studio/workspace.js
      - name: Unit tests
        run: node --test experimental/tests/*.test.js
      - name: End-to-end sample
        run: node experimental/cli.js experimental/examples/newsroom.scroll

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#0b1220"/>
<text x="48" y="60" font-family="Arial" font-size="32" fill="#f0f5ff" font-weight="bold">HiroGlifx Phase 13 — Canonical Variables and Animations</text>
<text x="48" y="94" font-family="Arial" font-size="17" fill="#a0b6d5">Code-derived preview of the new runtime, not a captured browser screenshot</text>
<rect x="48" y="131" width="515" height="475" rx="17" fill="#172540" stroke="#405b7e"/>
<text x="78" y="173" fill="#91c3ff" font-family="monospace" font-size="18">.Main = ()</text>
<text x="95" y="217" fill="#d7e5fa" font-family="monospace" font-size="18"># speed = 5;</text>
<text x="95" y="255" fill="#d7e5fa" font-family="monospace" font-size="18">$ title = "My Animation";</text>
<text x="95" y="293" fill="#d7e5fa" font-family="monospace" font-size="18">? active = true;</text>
<text x="95" y="331" fill="#b3f0d0" font-family="monospace" font-size="16">&amp; hero = box("hero", 90, 90, "blue");</text>
<text x="95" y="369" fill="#b3f0d0" font-family="monospace" font-size="17">&amp; intro = bounce(hero, 900);</text>
<text x="95" y="407" fill="#d7e5fa" font-family="monospace" font-size="18">intro.loop();</text>
<text x="95" y="445" fill="#d7e5fa" font-family="monospace" font-size="18">intro.play();</text>
<text x="95" y="483" fill="#d7e5fa" font-family="monospace" font-size="18">intro.pause();</text>
<text x="95" y="520" fill="#d7e5fa" font-family="monospace" font-size="18">spin(hero, 500);</text>
<text x="78" y="570" fill="#91c3ff" font-family="monospace" font-size="18">break;</text>
